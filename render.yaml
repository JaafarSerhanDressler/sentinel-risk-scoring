# Render blueprint: web service (built from the Dockerfile) + managed PostgreSQL.
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo, OR use the
# "Deploy to Render" button in the README.

databases:
  - name: sentinel-db
    databaseName: riskapp
    user: riskadmin
    plan: free

services:
  - type: web
    name: sentinel-risk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/dashboard/kpis
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render injects the Postgres URL; the app converts it to an Npgsql string.
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
